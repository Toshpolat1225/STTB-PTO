# AGMK-STTB — API shlyuz. Tashqariga faqat 8443 (HTTPS). Boshqaruv paneli (8080) shlyuz orqali OCHILMAYDI.
# Sertifikat — backend birinchi ishga tushishda yaratadi yoki eski serverdan koʻchiriladi (umumiy «certs» hajmi).

worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    server_tokens off;
    charset utf-8;
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    # yuklash chegaralari: yozuvlar paketi — 50 MB, fayl — 30 MB (server oʻzi ham tekshiradi)
    client_max_body_size 52m;
    client_body_buffer_size 1m;
    client_body_timeout 120s;
    send_timeout 120s;
    keepalive_timeout 65s;

    # kirishga urinishlar chegarasi (bitta IP dan): parol tanlashni sekinlashtiradi
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    gzip on;
    gzip_types application/json text/html application/javascript text/css;
    gzip_min_length 1024;

    upstream backend { server backend:8000; keepalive 16; }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;      # OCR va katta paketlar
        proxy_request_buffering on;

        location = /auth/v1/token {
            limit_req zone=login burst=20 nodelay;
            proxy_pass http://backend;
        }
        location = /auth/v1/signup {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
        }
        location / {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://backend;
        }
    }
}
